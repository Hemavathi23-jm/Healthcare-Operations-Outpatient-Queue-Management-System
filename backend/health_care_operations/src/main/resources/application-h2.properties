# ============================================================
# Spring Profile: h2 (zero-config embedded database)
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# ============================================================

# Application & Server Configuration
spring.application.name=health_care_operations
server.port=8080
server.servlet.context-path=/api/v1

# H2 In-Memory Database (MySQL compatible mode)
spring.datasource.url=jdbc:h2:mem:healthcare;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=KEY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (accessible at http://localhost:8080/api/v1/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Initialize schema and seed data from classpath SQL files
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql
spring.sql.init.data-locations=classpath:data-h2.sql

# Jackson JSON Configuration
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Security Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Logging
logging.level.root=INFO
logging.level.com.healthcare=DEBUG
logging.level.org.hibernate.SQL=WARN
